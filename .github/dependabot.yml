version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Minor and patch bumps land together; majors arrive one PR each so
      # their breaking changes can be reviewed on their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose to an exact beta (security-critical auth); upgrade by hand.
      - dependency-name: next-auth
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
