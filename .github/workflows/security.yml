name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories and CodeQL queries reach code nobody touched.
    - cron: "17 5 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a secret committed and later deleted still counts.
          fetch-depth: 0
      # The gitleaks CLI image rather than gitleaks-action, which needs a paid
      # licence on organisation-owned repositories.
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3
          git /repo --redact --verbose
